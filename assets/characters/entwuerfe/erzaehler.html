<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:3240px;height:1920px;display:flex;background:#111;font-family:"Helvetica Neue",Arial,sans-serif}
  .frame{position:relative;width:1080px;height:1920px;overflow:hidden}
  .tag{position:absolute;top:40px;left:40px;z-index:20;font:800 34px Arial;color:#fff;background:rgba(0,0,0,.55);padding:10px 22px;border-radius:14px}
  svg.char{position:absolute;left:40px;top:330px;width:948px;height:1660px;z-index:5}
  .bubble{position:absolute;left:60px;top:300px;width:700px;z-index:8;background:#fff;border:6px solid #1c1830;border-radius:44px;padding:30px 40px;
    font:900 66px/1.05 "Arial Black",Arial;color:#1c1830;text-transform:uppercase}
  .bubble:after{content:"";position:absolute;left:520px;bottom:-46px;width:56px;height:56px;background:#fff;border-right:6px solid #1c1830;border-bottom:6px solid #1c1830;transform:rotate(40deg) skew(10deg,10deg)}
  .badge{position:absolute;left:50px;top:1400px;width:240px;height:240px;border-radius:50%;overflow:hidden;z-index:12;border:10px solid var(--sig);background:var(--bg2);box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .badge svg{position:absolute;left:-312px;top:-285px;width:840px;height:1470px}
  .sub{position:absolute;left:0;right:0;top:1230px;text-align:center;z-index:12;font:900 120px "Arial Black",Arial;color:#fff;
    -webkit-text-stroke:12px #1c1830;paint-order:stroke fill;letter-spacing:2px}
  .sub b{color:var(--sig)}
  .stamp{position:absolute;left:90px;right:90px;text-align:center;top:300px;font-size:130px !important;z-index:9;border:14px solid #d62839;color:#d62839;font:900 110px "Arial Black",Arial;
    padding:6px 34px;transform:rotate(-9deg);border-radius:20px;background:rgba(255,255,255,.65)}
  .window{position:absolute;border:14px solid #1c1830;background:linear-gradient(#8fd3ff,#d8f1ff);overflow:hidden}
  .floor{position:absolute;left:0;right:0;bottom:0;height:560px}
  .plant{position:absolute;z-index:3}
</style></head><body>

<script>
const L = '#1c1830';
const skinTone = '#f0b98d';

function arm(x1,y1,x2,y2,color){ // Ärmel: dunkle Kontur + Füllung
  return `<path d="M${x1} ${y1} L${x2} ${y2}" stroke="${L}" stroke-width="32" stroke-linecap="round" fill="none"/>
          <path d="M${x1} ${y1} L${x2} ${y2}" stroke="${color}" stroke-width="24" stroke-linecap="round" fill="none"/>`;
}
function hand(x,y,r=13){ return `<circle cx="${x}" cy="${y}" r="${r}" fill="${skinTone}" stroke="${L}" stroke-width="4"/>`; }

function face(){
  return `
   <ellipse cx="166" cy="190" rx="21" ry="23" fill="#fff" stroke="${L}" stroke-width="4"/>
   <ellipse cx="236" cy="190" rx="21" ry="23" fill="#fff" stroke="${L}" stroke-width="4"/>
   <circle cx="172" cy="193" r="9" fill="${L}"/><circle cx="242" cy="193" r="9" fill="${L}"/>
   <circle cx="175" cy="189" r="3" fill="#fff"/><circle cx="245" cy="189" r="3" fill="#fff"/>
   <path d="M138 160 Q160 146 190 160" stroke="${L}" stroke-width="7" fill="none" stroke-linecap="round"/>
   <path d="M214 166 Q240 164 266 150" stroke="${L}" stroke-width="7" fill="none" stroke-linecap="round"/>
   <path d="M178 238 Q206 252 238 232" stroke="${L}" stroke-width="5" fill="none" stroke-linecap="round"/>
   <path d="M236 232 l8 -6" stroke="${L}" stroke-width="5" stroke-linecap="round"/>
   <ellipse cx="200" cy="215" rx="9" ry="6" fill="#e39f73" stroke="${L}" stroke-width="3"/>`;
}
function headBase(){
  return `
   <ellipse cx="118" cy="195" rx="14" ry="20" fill="${skinTone}" stroke="${L}" stroke-width="4"/>
   <ellipse cx="284" cy="195" rx="14" ry="20" fill="${skinTone}" stroke="${L}" stroke-width="4"/>
   <rect x="182" y="258" width="38" height="30" fill="#e5a37a" stroke="${L}" stroke-width="4"/>
   <ellipse cx="201" cy="188" rx="84" ry="76" fill="${skinTone}" stroke="${L}" stroke-width="4"/>`;
}
function legs(pants,shoe){
  return `
   <rect x="148" y="430" width="44" height="130" rx="14" fill="${pants}" stroke="${L}" stroke-width="4"/>
   <rect x="210" y="430" width="44" height="130" rx="14" fill="${pants}" stroke="${L}" stroke-width="4"/>
   <path d="M134 556 h66 v22 q0 10 -10 10 h-46 q-14 0 -10 -18z" fill="${shoe}" stroke="${L}" stroke-width="4"/>
   <path d="M204 556 h66 v22 q0 10 -10 10 h-46 q-14 0 -10 -18z" fill="${shoe}" stroke="${L}" stroke-width="4"/>`;
}
function wrap(inner){ return `<svg class="char" viewBox="0 0 400 700" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`; }

/* ---------- Entwurf A: Der Augenschirm (Lime) ---------- */
function charA(sig){
  return wrap(`
   ${legs('#2f3a63','#f2f2f2')}
   <rect x="138" y="276" width="126" height="170" rx="34" fill="#ffffff" stroke="${L}" stroke-width="4"/>
   <path d="M168 282 L170 440 M234 282 L232 440" stroke="${sig}" stroke-width="14" stroke-linecap="round"/>
   <path d="M168 282 L170 440 M234 282 L232 440" stroke="${L}" stroke-width="2" stroke-linecap="round" opacity=".5"/>
   ${arm(146,300,112,402,'#ffffff')}${hand(110,414)}
   ${arm(256,300,316,258,'#ffffff')}
   <g transform="translate(300 160) rotate(12)">
     <rect x="0" y="0" width="62" height="86" rx="10" fill="#2b2b3d" stroke="${L}" stroke-width="4"/>
     <rect x="8" y="8" width="46" height="18" rx="4" fill="${sig}" stroke="${L}" stroke-width="2"/>
     ${[0,1,2].map(r=>[0,1,2].map(c=>`<rect x="${8+c*16}" y="${34+r*16}" width="12" height="12" rx="3" fill="#f4f4f4"/>`).join('')).join('')}
   </g>
   ${hand(318,252)}
   ${headBase()}
   <path d="M120 150 Q124 104 201 100 Q280 104 284 150 Q250 128 201 128 Q152 128 120 150z" fill="#4a2f1f" stroke="${L}" stroke-width="4"/>
   ${face()}
   <path d="M104 146 Q201 108 298 146 L312 170 Q201 148 90 170z" fill="${sig}" opacity=".92" stroke="${L}" stroke-width="4" stroke-linejoin="round"/>
   <path d="M112 150 Q201 118 290 150" stroke="${L}" stroke-width="3" fill="none" opacity=".35"/>
  `);
}
/* ---------- Entwurf B: Bleistift & Riesenbrille (Koralle) ---------- */
function charB(sig){
  return wrap(`
   ${legs('#2c2c3e','#ffffff')}
   <rect x="134" y="276" width="134" height="170" rx="38" fill="${sig}" stroke="${L}" stroke-width="4"/>
   <path d="M150 290 Q201 330 252 290" fill="none" stroke="${L}" stroke-width="4"/>
   <path d="M174 392 h54 q8 0 8 10 v30 h-70 v-30 q0 -10 8 -10z" fill="none" stroke="${L}" stroke-width="4" opacity=".6"/>
   ${arm(142,302,108,404,sig)}${hand(106,416)}
   ${arm(260,302,318,262,sig)}${hand(320,254)}
   <path d="M320 242 v-34" stroke="${L}" stroke-width="12" stroke-linecap="round"/><path d="M320 242 v-34" stroke="${skinTone}" stroke-width="6" stroke-linecap="round"/>
   ${headBase()}
   <path d="M124 148 Q130 100 201 98 Q272 100 278 148 Q246 124 201 126 Q156 124 124 148z" fill="#2d1b14" stroke="${L}" stroke-width="4"/>
   <circle cx="201" cy="90" r="30" fill="#2d1b14" stroke="${L}" stroke-width="4"/>
   <path d="M168 62 Q201 36 234 62" fill="none" stroke="${L}" stroke-width="3" opacity=".5"/>
   <path d="M102 176 L96 130" stroke="${L}" stroke-width="12" stroke-linecap="round"/><path d="M102 176 L96 130" stroke="#ffcc29" stroke-width="7" stroke-linecap="round"/>
   <path d="M95 126 l8 -2" stroke="${L}" stroke-width="5" stroke-linecap="round"/>
   ${face()}
   <circle cx="166" cy="190" r="34" fill="rgba(255,255,255,.18)" stroke="${L}" stroke-width="9"/>
   <circle cx="236" cy="190" r="34" fill="rgba(255,255,255,.18)" stroke="${L}" stroke-width="9"/>
   <path d="M200 188 h2" stroke="${L}" stroke-width="9"/>
   <path d="M132 186 L118 182 M270 186 L284 182" stroke="${L}" stroke-width="8" stroke-linecap="round"/>
  `);
}
/* ---------- Entwurf C: Münz-Beanie, Monokel & Fliege (Violett) ---------- */
function charC(sig){
  return wrap(`
   ${legs('#3b2a5c','#f4e3c1')}
   <rect x="138" y="276" width="126" height="170" rx="34" fill="#f7f1e3" stroke="${L}" stroke-width="4"/>
   <path d="M201 300 L201 440" stroke="${L}" stroke-width="3" opacity=".4"/>
   ${[330,368,406].map(y=>`<circle cx="201" cy="${y}" r="6" fill="${sig}" stroke="${L}" stroke-width="2"/>`).join('')}
   <path d="M142 330 Q201 370 260 330 L268 300 L134 300z" fill="#4a3a73" stroke="${L}" stroke-width="4"/>
   ${arm(146,302,112,404,'#4a3a73')}${hand(110,416)}
   ${arm(256,302,314,266,'#4a3a73')}${hand(316,258)}
   <path d="M316 246 v-30" stroke="${L}" stroke-width="12" stroke-linecap="round"/><path d="M316 246 v-30" stroke="${skinTone}" stroke-width="6" stroke-linecap="round"/>
   ${headBase()}
   <path d="M120 156 Q118 90 201 84 Q284 90 282 156 L270 160 Q262 118 201 116 Q140 118 132 160z" fill="${sig}" stroke="${L}" stroke-width="4"/>
   <path d="M122 148 Q201 128 280 148 L282 168 Q201 150 120 168z" fill="#fff" opacity=".35" stroke="${L}" stroke-width="3"/>
   <circle cx="201" cy="78" r="26" fill="#ffcc29" stroke="${L}" stroke-width="4"/>
   <text x="201" y="88" text-anchor="middle" font-family="Arial Black" font-size="30" fill="${L}">€</text>
   ${face()}
   <circle cx="236" cy="190" r="32" fill="rgba(255,255,255,.2)" stroke="#e8b923" stroke-width="7"/>
   <path d="M262 214 Q276 250 258 290" fill="none" stroke="#e8b923" stroke-width="4"/>
   <path d="M201 286 L172 270 L172 308z M201 286 L230 270 L230 308z" fill="${sig}" stroke="${L}" stroke-width="4" stroke-linejoin="round"/>
   <circle cx="201" cy="289" r="8" fill="${sig}" stroke="${L}" stroke-width="4"/>
  `);
}

function room(sig, bg1, bg2, floor){
  return `
   <div style="position:absolute;inset:0;background:linear-gradient(${bg1},${bg2})"></div>
   <div class="window" style="left:90px;top:520px;width:380px;height:520px"><div style="position:absolute;inset:0;background:
      linear-gradient(#1c1830,#1c1830) 40px 280px/60px 240px no-repeat,linear-gradient(#1c1830,#1c1830) 130px 200px/70px 320px no-repeat,
      linear-gradient(#1c1830,#1c1830) 230px 300px/50px 220px no-repeat,linear-gradient(#1c1830,#1c1830) 300px 240px/60px 280px no-repeat;opacity:.55"></div>
      <div style="position:absolute;left:50%;top:0;bottom:0;width:12px;background:#1c1830;margin-left:-6px"></div></div>
   <div class="window" style="left:640px;top:600px;width:340px;height:440px"><div style="position:absolute;left:50%;top:0;bottom:0;width:12px;background:#1c1830;margin-left:-6px"></div></div>
   <div class="floor" style="background:${floor};border-top:10px solid #1c1830"></div>
   <div style="position:absolute;left:150px;bottom:470px;width:260px;height:30px;border-radius:50%;background:rgba(0,0,0,.18);z-index:4"></div>
   <div class="plant" style="right:30px;bottom:540px;width:200px;height:300px">
     <svg viewBox="0 0 200 300" width="200" height="300"><path d="M100 220 Q60 120 40 80 M100 220 Q100 100 110 40 M100 220 Q150 130 170 90" stroke="${L}" stroke-width="6" fill="none"/>
     <ellipse cx="40" cy="80" rx="26" ry="50" fill="#5db36a" stroke="${L}" stroke-width="4" transform="rotate(-24 40 80)"/>
     <ellipse cx="110" cy="40" rx="26" ry="52" fill="#4aa15a" stroke="${L}" stroke-width="4"/>
     <ellipse cx="170" cy="90" rx="26" ry="50" fill="#5db36a" stroke="${L}" stroke-width="4" transform="rotate(24 170 90)"/>
     <path d="M60 220 h80 l-10 70 h-60z" fill="#c8693c" stroke="${L}" stroke-width="4"/></svg></div>`;
}

const drafts = [
  {tag:'A · Der Augenschirm · Signaturfarbe Lime #A8E63D', sig:'#A8E63D', bg:['#ffe9c7','#ffd49b'], floor:'#b98a62', bg2:'#ffe9c7', fn:charA, word:'Lime'},
  {tag:'B · Bleistift & Riesenbrille · Signaturfarbe Koralle #FF6B4A', sig:'#FF6B4A', bg:['#d9ecff','#b5d7ff'], floor:'#8b7bb5', bg2:'#d9ecff', fn:charB, word:'Koralle'},
  {tag:'C · Münz-Beanie, Monokel & Fliege · Signaturfarbe Violett #8B5CF6', sig:'#8B5CF6', bg:['#ffeed6','#ffdfa8'], floor:'#6e5a47', bg2:'#ffeed6', fn:charC, word:'Violett'},
];
const MODE = location.hash === '#urteil' ? 'urteil' : 'intro';
document.body.innerHTML = drafts.map(d => `
  <div class="frame" style="--sig:${d.sig};--bg2:${d.bg2}">
    ${room(d.sig, d.bg[0], d.bg[1], d.floor)}
    <div class="tag">Entwurf ${d.tag} · ${MODE === 'intro' ? 'Intro' : 'Urteil'}</div>
    ${MODE === 'intro' ? '<div class="bubble">Wie konnten die sich das leisten?</div>' : '<div class="stamp">UNMÖGLICH</div>'}
    ${d.fn(d.sig)}
    <div class="badge">${d.fn(d.sig)}</div>
    <div class="sub">${MODE === 'intro' ? 'NACH<b>RECHNEN</b>' : 'DAS GEHT <b>NICHT</b>'}</div>
  </div>`).join('');
</script>
</body></html>
